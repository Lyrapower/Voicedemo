<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070E">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GRID</title>
<style>
/* ── tokens ──
   墨 #06070E · 星雾 #16173A · 粒 #C9CCEA · 文 #E3E5F2 · 灰 #6E7190 · 青 #8FD8E8 */
:root{
  --mo:#06070E; --wen:#E3E5F2; --hui:#6E7190; --an:#43465F;
  --qing:#8FD8E8; --jie:rgba(140,138,200,.14);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--mo);color:var(--wen);
  font:16px/1.9 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body{background-image:radial-gradient(130% 46% at 50% -6%,#16173A 0%,rgba(22,23,58,0) 62%)}

#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

#head{flex:none;padding:calc(10px + env(safe-area-inset-top)) 18px 0}
#toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
#lanes{display:flex;gap:20px;align-items:baseline}
.lane{background:none;border:none;padding:0;cursor:pointer;
  font:600 12px var(--mono);letter-spacing:.32em;color:var(--an);
  text-shadow:none;transition:color .2s,text-shadow .2s;-webkit-tap-highlight-color:transparent}
.lane.on[data-lane="grid"]{color:#9B9ED0;text-shadow:0 0 18px rgba(155,158,208,.5)}
.lane.on[data-lane="qwen"]{color:var(--qing);text-shadow:0 0 16px rgba(143,216,232,.35)}
.lane.on[data-lane="coach"]{color:#E8B86B;text-shadow:0 0 16px rgba(232,184,107,.35)}
#coachPanel{flex:1;overflow:hidden;display:none;flex-direction:column;min-height:0}
#coachPanel.on{display:flex}

/* ── Coach Inbox (spec v1) ── */
.cin-view{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 16px 12px}
.cin-view.hidden{display:none!important}
.cin-head{display:flex;align-items:center;gap:10px;padding:10px 0 8px;flex-wrap:wrap}
.cin-title{font:600 15px var(--sans);color:var(--wen);letter-spacing:.04em}
.cin-budget{flex:1;font:10px var(--mono);color:var(--hui);text-align:right}
.cin-budget.amber{color:#E8B86B}
.cin-manual{border:1px solid rgba(232,184,107,.45);background:rgba(40,32,18,.55);color:#E8B86B;
  font:11px var(--mono);padding:7px 12px;border-radius:8px;cursor:pointer}
.cin-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.cin-chip{flex:none;border:1px solid var(--jie);background:rgba(18,19,40,.5);color:var(--hui);
  font:10px var(--mono);padding:8px 12px;border-radius:999px;cursor:pointer;min-height:44px}
.cin-chip.on{color:#E8B86B;border-color:rgba(232,184,107,.5);background:rgba(232,184,107,.1)}
.cin-rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px}
.cin-row{width:100%;text-align:left;border:1px solid transparent;background:rgba(18,19,40,.35);
  border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--wen);min-height:44px}
.cin-row:hover{border-color:var(--jie);background:rgba(18,19,40,.62)}
.cin-row-l1{display:block;font:11px var(--mono);line-height:1.5;color:var(--wen)}
.cin-row-l2{display:block;font:10px var(--mono);color:var(--hui);margin-top:2px}
.cin-dot.pending{color:#8FD8E8}.cin-dot.held{color:#E8B86B}.cin-dot.approved{color:#8FD0A8}
.cin-dot.rejected{color:#C97B6E}.cin-dot.skip{color:var(--an)}
.cin-node{color:var(--hui);margin:0 4px}
.cin-skip{font-style:italic;color:var(--an)}
.cin-empty{font:12px var(--mono);color:var(--hui);padding:24px 8px;line-height:1.6}
.cin-link{background:none;border:none;color:#E8B86B;font:inherit;cursor:pointer;text-decoration:underline}
.cin-more{align-self:center;margin:10px 0;border:1px solid var(--jie);background:none;color:var(--hui);
  font:10px var(--mono);padding:8px 16px;border-radius:8px;cursor:pointer}
.cin-more.hidden{display:none}
.cin-detail-head{display:flex;align-items:center;gap:10px;padding:8px 0}
.cin-back{border:none;background:none;color:#E8B86B;font:18px var(--sans);cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px}
.cin-detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.cin-card{border:1px solid var(--jie);border-radius:10px;background:rgba(18,19,40,.4);overflow:hidden}
.cin-card-lbl{font:9px var(--mono);color:var(--an);letter-spacing:.12em;padding:8px 10px 0}
.cin-card-body{padding:8px 10px 10px;font:12px/1.55 var(--sans);color:var(--wen)}
.cin-card.cin-coach{border-color:rgba(232,184,107,.35)}
.cin-pre,.cin-json{font:11px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:12em;overflow:auto;margin:0}
.cin-mono{font:10px var(--mono);color:var(--hui);word-break:break-all}
.cin-copy{border:1px solid var(--jie);background:none;color:var(--hui);font:9px var(--mono);padding:2px 6px;border-radius:4px;cursor:pointer;margin-left:6px}
.cin-chip-ft{display:inline-block;font:10px var(--mono);padding:4px 8px;border-radius:6px;
  background:rgba(232,184,107,.15);color:#E8B86B;margin-bottom:8px}
.cin-amber-block{border:1px solid rgba(232,184,107,.4);border-radius:8px;background:rgba(40,32,18,.4);margin-top:8px}
.cin-amber-cap{font:9px var(--mono);color:#E8B86B;padding:6px 8px;border-bottom:1px solid rgba(232,184,107,.2)}
.cin-amber-block pre{padding:8px;margin:0;font:10px var(--mono);overflow:auto}
.cin-vocab{background:rgba(201,123,110,.15);color:#E8A090;font:10px var(--mono);padding:8px;border-radius:6px;margin-bottom:8px}
.cin-fold{margin-top:8px;font:11px var(--mono);color:var(--hui)}
.cin-fold summary{cursor:pointer;color:var(--wen);min-height:44px;display:flex;align-items:center}
.cin-cost-foot{font:9px var(--mono);color:var(--an);margin-top:10px;padding-top:8px;border-top:1px solid var(--jie)}
.cin-muted{font:10px var(--mono);color:var(--an);font-style:italic}
.cin-actions{flex:none;border-top:1px solid var(--jie);padding:10px 0 calc(8px + env(safe-area-inset-bottom));background:rgba(6,7,14,.92)}
.cin-actions-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cin-cur-st{font:10px var(--mono);color:var(--hui);margin-right:4px}
.cin-act{font:11px var(--mono);padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px}
.cin-act.approve{background:#8FD0A8;color:#0A0910;border:none;font-weight:600}
.cin-act.reject{border:1px solid #C97B6E;color:#E8A090;background:transparent}
.cin-act.hold{border:1px solid #E8B86B;color:#E8B86B;background:transparent}
.cin-act:disabled{opacity:.35;cursor:not-allowed}
.cin-reason{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cin-reason.hidden{display:none!important}
.cin-reason input{flex:1;min-width:120px;background:rgba(18,19,40,.62);border:1px solid var(--jie);
  color:var(--wen);font:11px var(--mono);padding:10px;border-radius:8px;outline:none}
.cin-reason button{font:10px var(--mono);padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--jie);background:rgba(18,19,40,.62);color:var(--wen)}
.cin-compose-head{display:flex;align-items:center;gap:10px;padding:8px 0}
.cin-compose-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.cin-lbl{font:9px var(--mono);color:var(--an);letter-spacing:.12em}
.cin-ta{width:100%;min-height:120px;resize:vertical;background:rgba(18,19,40,.62);color:var(--wen);
  border:1px solid var(--jie);border-radius:10px;padding:10px;font:12px/1.45 var(--mono);outline:none}
.cin-compose-btns{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.cin-compose-btns button{border:1px solid rgba(232,184,107,.35);background:rgba(40,32,18,.5);
  color:#E8B86B;font:11px var(--mono);padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px}
.cin-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:99;font:11px var(--mono);padding:10px 16px;border-radius:8px;background:rgba(18,19,40,.95);border:1px solid var(--jie)}
.cin-toast.ok{border-color:rgba(143,208,168,.5);color:#8FD0A8}
.cin-toast.err{border-color:rgba(201,123,110,.5);color:#E8A090}
.cin-toast.hidden{display:none}
#cfg{background:none;border:none;color:var(--an);font:20px/1 var(--mono);
  padding:2px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#conn{max-height:0;overflow:hidden;transition:max-height .25s ease}
#conn.open{max-height:220px}
#conn input{display:block;width:100%;background:none;border:none;outline:none;
  color:var(--hui);font:11px var(--mono);letter-spacing:.05em;padding:4px 0 2px}
#conn input::placeholder{color:var(--an)}
#conn .hint{font:10px var(--mono);color:var(--an);letter-spacing:.04em;padding:2px 0 6px}
#kh{display:flex;gap:8px;align-items:center;padding:4px 0 8px;flex-wrap:wrap}
#kh input{flex:1;min-width:120px;background:none;border:none;outline:none;color:var(--hui);
  font:11px var(--mono);letter-spacing:.04em}
#kh button{border:1px solid var(--jie);background:rgba(18,19,40,.62);color:var(--hui);
  font:10px var(--mono);padding:4px 10px;border-radius:8px;cursor:pointer}
#khst{font:10px var(--mono);color:var(--an)}

#m{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12vh 20px 24px;scrollbar-width:none}
#m::-webkit-scrollbar{display:none}

.u{color:var(--hui);font-size:14px;line-height:1.7;margin:30px 0 14px;
  padding-left:14px;border-left:1px solid var(--jie);
  white-space:pre-wrap;word-break:break-word}
.u img{display:block;max-width:62%;border-radius:12px;margin:0 0 8px auto;border:1px solid var(--jie)}
.g{white-space:pre-wrap;word-break:break-word;margin:0 0 6px;
  font-weight:500;letter-spacing:.015em;
  text-shadow:0 0 22px rgba(180,183,235,.28)}
.g.qwen{text-shadow:0 0 20px rgba(143,216,232,.22)}
.g.err{color:var(--hui);font-size:14px;text-shadow:none;font-weight:400}
.from-grid,.job-card{border:1px solid var(--jie);border-radius:10px;padding:8px 10px;margin:8px 0 10px;
  background:rgba(18,19,40,.35);font:12px/1.55 var(--sans);white-space:pre-wrap;word-break:break-word}
.job-card summary{cursor:pointer;font:11px var(--mono);color:var(--hui);list-style:none}
.job-card[data-st="pending"]{opacity:.7}
.t{font:10.5px var(--mono);color:var(--an);letter-spacing:.06em;margin:10px 0 0}
.t i{font-style:normal;color:#565A7C}

#down{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
  width:34px;height:34px;border-radius:50%;border:1px solid var(--jie);
  background:rgba(6,7,14,.8);color:var(--hui);font-size:15px;line-height:32px;
  text-align:center;display:none;z-index:2}

#c{flex:none;display:flex;gap:8px;align-items:flex-end;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(6,7,14,0),var(--mo) 34%)}
#i{flex:1;min-width:0;max-height:138px;resize:none;background:rgba(18,19,40,.62);
  color:var(--wen);border:1px solid var(--jie);border-radius:14px;
  padding:11px 15px;font:16px/1.55 var(--sans);outline:none;
  backdrop-filter:blur(8px);transition:border-color .2s}
#i:focus{border-color:rgba(143,216,232,.45)}
#compileMode{flex:none;width:38px;height:38px;margin-bottom:5px;border-radius:50%;
  border:2px solid #E8B86B;background:rgba(28,24,14,.82);
  color:#E8B86B;font:700 13px/34px var(--mono);text-align:center;padding:0;cursor:pointer;
  box-shadow:0 0 16px rgba(232,184,107,.45);-webkit-tap-highlight-color:transparent}
#compileMode.on{color:#0A0910;border:none;
  background:radial-gradient(circle at 35% 28%,#F0D9A0,#E8B86B);
  box-shadow:0 0 20px rgba(232,184,107,.65)}
body.lane-qwen #compileMode,body.lane-coach #compileMode{display:none!important}
#codeBackendRow{display:none;align-items:center;gap:6px;margin-bottom:5px;font:10px var(--mono);color:var(--an)}
body.lane-grid.compile-backend #codeBackendRow{display:flex}
#codeBackendRow button{border:1px solid rgba(143,208,168,.35);background:transparent;color:var(--an);
  border-radius:999px;padding:4px 10px;cursor:pointer;font:10px var(--mono)}
#codeBackendRow button.on{background:rgba(143,208,168,.18);color:#8FD0A8;border-color:#8FD0A8}
#codeBackendRow button.cc.on{background:rgba(232,184,107,.18);color:#E8B86B;border-color:#E8B86B}
#codeBackendPin{margin-left:4px;font:10px var(--mono);color:var(--an)}
#att{flex:none;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--jie);background:rgba(18,19,40,.62);
  color:var(--hui);font:20px/1 var(--sans);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
#file{display:none}
#prev{display:none;position:absolute;bottom:calc(74px + env(safe-area-inset-bottom));
  left:16px;z-index:3;border:1px solid var(--jie);border-radius:12px;
  background:rgba(10,11,24,.9);padding:6px;backdrop-filter:blur(8px)}
#prev img{display:block;max-height:88px;border-radius:8px}
#prev button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;
  border-radius:50%;border:none;background:#43465F;color:var(--wen);
  font:12px/1 var(--sans);cursor:pointer}
#s{flex:none;width:44px;height:44px;border-radius:50%;border:none;
  background:radial-gradient(circle at 35% 30%,#B8BBEE,#7E82C8);
  color:#0A0B18;font:600 15px var(--sans);
  box-shadow:0 0 22px rgba(155,158,220,.35)}
#s.qwen{background:radial-gradient(circle at 35% 30%,#A8E8F4,#5BA8C0);
  box-shadow:0 0 22px rgba(143,216,232,.28)}
#s:disabled{opacity:.3;box-shadow:none}
#mic{flex:none;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--jie);background:rgba(18,19,40,.62);
  color:var(--hui);font:18px/1 var(--sans);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
#mic.on{color:var(--qing);border-color:rgba(143,216,232,.55);
  box-shadow:0 0 18px rgba(143,216,232,.25)}
#voiceBarge{flex:none;width:38px;height:38px;margin-bottom:5px;border-radius:50%;
  border:1px solid var(--jie);background:rgba(18,19,40,.62);color:var(--hui);
  font:14px/1 var(--sans);cursor:pointer;display:none;-webkit-tap-highlight-color:transparent}
#voiceBarge.on{display:block;color:#E8B86B;border-color:rgba(232,184,107,.55)}
#vst{font:10px var(--mono);color:var(--an);letter-spacing:.08em;
  padding:0 4px 2px;text-align:center;min-height:14px}
#vas{font:10px var(--mono);color:#565A7C;letter-spacing:.04em;
  padding:0 12px 4px;text-align:center;min-height:14px;line-height:1.4}
#vdeg{font:10px var(--mono);color:#B89090;letter-spacing:.04em;
  padding:0 12px 2px;text-align:center;min-height:14px;line-height:1.4}
#vhint{font:10px var(--mono);color:#7A4A4A;letter-spacing:.04em;
  padding:0 12px 8px;text-align:center;line-height:1.5}
#vhint b{color:#B89090;font-weight:600}

#laneHud{flex:1;font:10px var(--mono);color:var(--hui);letter-spacing:.04em;
  padding:0 4px 4px;text-align:center;min-height:16px;line-height:1.45}
#laneHudRow{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px 4px}
#laneClear{flex:none;display:none;border:1px solid rgba(232,184,107,.45);background:rgba(28,24,14,.75);
  color:#E8B86B;font:600 10px var(--mono);padding:4px 10px;border-radius:999px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
#laneClear.on{display:inline-block}
#laneHud.compile{color:#E8B86B}
#laneHud b{color:var(--wen);font-weight:600}
#laneHud .fable-policy{color:#E8B86B}

.coach-confirm{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(232,184,107,.55);
  background:rgba(40,32,18,.65);font:11px var(--mono);color:var(--wen);line-height:1.55;
  box-shadow:0 0 24px rgba(232,184,107,.12)}
.coach-confirm b{color:#E8B86B;font-weight:600}
.coach-confirm button{margin-top:6px;margin-right:8px;border:1px solid rgba(232,184,107,.45);
  background:rgba(18,19,40,.62);color:#E8B86B;font:10px var(--mono);padding:6px 12px;border-radius:8px;cursor:pointer;min-height:44px}
.coach-confirm button.go{background:#E8B86B;color:#0A0910;font-weight:600;border:none}
.coach-confirm.done{color:#8FD0A8;border-color:rgba(143,208,168,.35)}
.coach-confirm.skip{color:var(--an);font-style:italic}

@media (prefers-reduced-motion:reduce){ #conn{transition:none} }
</style>
</head>
<body class="lane-grid"><script>try{var _l=JSON.parse(localStorage.getItem("lane"));document.body.className="lane-"+(_l==="qwen"?"qwen":"grid")}catch(e){}</script>
<canvas id="sky"></canvas>
<div id="app">
  <div id="head">
    <div id="toprow">
      <div id="lanes">
        <button type="button" class="lane on" data-lane="grid">G R I D</button>
        <button type="button" class="lane" data-lane="qwen">Qwen 3.5</button>
      </div>
      <button type="button" id="cfg" aria-label="gateway">·</button>
    </div>
    <div id="conn">
      <input id="gw" spellcheck="false" autocapitalize="off" placeholder="gateway · https://…/v1">
      <div class="hint">读图模型 (各 lane 独立, 仅带图时切换)</div>
      <input id="vlg" spellcheck="false" autocapitalize="off" placeholder="grid vision · qwen/qwen3.5-9b">
      <input id="vlq" spellcheck="false" autocapitalize="off" placeholder="qwen vision · qwen/qwen3.5-9b">
      <div class="hint">store token（可选 · 仅当 8501 进程设置了 GRID_STORE_TOKEN 才需要）</div>
      <input id="storetok" type="password" spellcheck="false" autocapitalize="off"
        placeholder="X-Grid-Token" autocomplete="off">
      <button type="button" id="storetokClear">清除本机 token</button>
      <div id="storest" class="hint">store: —</div>
      <div class="hint">GridKeyholder (可选 · demo/aster 已由 8515 服务端验签)</div>
      <div id="kh">
        <input id="khkey" type="password" spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="keyholder hex · 一次性录入 · 仅存本机">
        <button type="button" id="khsave">保存</button>
        <button type="button" id="khclear">清除</button>
      </div>
      <div id="khst" class="hint">keyholder: —</div>
    </div>
  </div>
  <div id="m"></div>
  <div id="down">↓</div>
  <div id="prev"><img id="previmg" alt=""><button type="button" id="prevx">×</button></div>
  <div id="c">
    <button type="button" id="att">＋</button>
    <input type="file" id="file" accept="image/*">
    <button type="button" id="mic" aria-label="voice" title="语音">◉</button>
    <button type="button" id="voiceBarge" aria-label="按住打断" title="按住打断 TTS">⏸</button>
    <textarea id="i" rows="1" enterkeyhint="send" placeholder="…"></textarea>
    <div id="codeBackendRow" aria-label="Compile 执行舱">
      <button type="button" id="backendLocal" class="on">本地</button>
      <button type="button" id="backendCc">CC</button>
      <label id="codeBackendPin"><input type="checkbox" id="backendPin"> 记住</label>
    </div>
    <button type="button" id="compileMode" title="Compile 模式 → field-compile（金色 C）" aria-label="Compile mode">C</button>
    <button type="button" id="s">发</button>
  </div>
  <div id="laneHudRow">
    <div id="laneHud" aria-live="polite">ui · loading…</div>
    <button type="button" id="laneClear" title="清空 GRID store 上下文（field-particle）">清场</button>
  </div>
  <div id="vst" aria-live="polite"></div>
  <div id="vas" aria-live="polite"></div>
  <div id="vdeg" aria-live="polite"></div>

function epochStartTs(){
  const anchor=new Date(STORE_ANCHOR+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  const msDay=86400000;
  const days=Math.floor((today-anchor)/msDay);
  if(days<0) return anchor.getTime()/1000;
  const idx=Math.floor(days/STORE_EPOCH_DAYS);
  const start=new Date(anchor);
  start.setDate(anchor.getDate()+idx*STORE_EPOCH_DAYS);
  return start.getTime()/1000;
}
function classifyTask(text){
  const low=String(text||"").toLowerCase();
  if(String(text||"").includes("这是你的日记本")) return "diary";
  if(low.includes("handoff_protocol")||low.includes("handoff protocol")||String(text||"").includes("交接协议"))
    return "handoff_protocol";
  if(low.includes("compile_json")||(low.includes("json")&&/compile|schema|artifact|protocol|handoff/.test(low)))
    return "compile_json";
  return "chat";
}

async function pullStoreLane(nodeId,key){
  try{
    // 热库全量 + 冷库 archive 合并(不按 since_ts 丢旧正文——8501 才是记忆层)
    const r=await storeFetch(`${storeBase()}/store/conversations/${encodeURIComponent(nodeId)}?limit=500`);
    if(!r.ok) throw 0;
    const hot=await r.json();
    let cold=[];
    try{
      const ar=await storeFetch(`${storeBase()}/store/conversations/${encodeURIComponent(nodeId)}/archive?limit=500`);
      if(ar.ok){
        const j=await ar.json();
        cold=Array.isArray(j.messages)?j.messages:[];
      }
    }catch(_){}
    const byKey=new Map();
    for(const m of [...cold, ...(Array.isArray(hot)?hot:[])]){
      const k=`${m.role}|${m.ts}|${String(m.content||"").slice(0,64)}`;
      byKey.set(k,m);
    }
    const rows=[...byKey.values()].sort((a,b)=>Number(a.ts||0)-Number(b.ts||0));

      role:m.role,
      content:scrubMsg(m.content||""),

  }catch(e){ storeOnline=false; }

async function confirmPendingCc(taskHint,outEl,histLane,taskLane,userText){
  const task=(taskHint||pendingCcTask||userText||"").trim();
  if(!task){ outEl.textContent="无 cc_task，无法确认"; return; }
  if(!harnessBase()){ outEl.textContent="无同源 Grid 入口，无法确认"; return; }
  const btn=outEl.querySelector("button");
  if(btn) btn.disabled=true;
  pendingCcTask=task;
  outEl.textContent="CC 登记候选…";
  try{
    let cand=lastCcCandidate && lastCcCandidate.goal===task ? lastCcCandidate : null;
    if(!cand){
      const reg=await fetch(harnessBase()+"/compile/register",{method:"POST",
        credentials:"include",
        headers:storeHdrs(),
        body:JSON.stringify({goal:task,session_id:storeLaneKey(taskLane||lastGridTask||"compile")})});
      if(!reg.ok){
        const err=await reg.text();
        throw new Error("register "+reg.status+" "+err.slice(0,180));
      }
      cand=await reg.json();
      cand.goal=task;
      lastCcCandidate=cand;
    }
    outEl.textContent="CC 确认提交中…";
    const r=await fetch(harnessBase()+"/compile/confirm",{method:"POST",
      credentials:"include",
      headers:storeHdrs(),
      body:JSON.stringify({candidate_id:cand.candidate_id,binding_hash:cand.binding_hash,session_id:cand.session_id||""})});
    if(r.status===409){
      const mapped=await fetch(harnessBase()+"/compile/map/"+encodeURIComponent(cand.candidate_id),{credentials:"include",headers:storeHdrs()});
      if(mapped.ok){
        const j=await mapped.json();
        if(j.job_id && !String(j.job_id).startsWith("reserved:")){
          outEl.className="g";
          outEl.textContent="已提交 job "+j.job_id+" · "+(j.status||"retry");
          if(cand.candidate_id) pollCompileJob(cand.candidate_id,outEl);
          return;
        }
      }
    }
    if(!r.ok){
      const err=await r.text();
      throw new Error("confirm "+r.status+" "+err.slice(0,180));
    }
    const rec=await r.json();
    const jid=rec.job_id||"";
    if(!jid){ throw new Error("confirm missing job_id"); }
    outEl.className="g";
    outEl.textContent="已提交 job "+jid+" · "+(rec.status||"");
    histLane.push({role:"assistant",content:outEl.textContent});
    if(lane==="grid" && !task.startsWith("ONESHOT_MARKER")){
      pushStoreMsgs(taskLane,[{role:"assistant",content:outEl.textContent}]);
    }
    if(cand.candidate_id) pollCompileJob(cand.candidate_id,outEl);
  }catch(e){
    outEl.className="g err";
    outEl.textContent=String(e.message||e);
    if(btn) btn.disabled=false;
  }
}
async function pollCompileJob(candidateId,outEl){
  for(let i=0;i<90;i++){
    try{
      const r=await fetch(harnessBase()+"/compile/map/"+encodeURIComponent(candidateId),{credentials:"include",headers:storeHdrs()});
      if(r.ok){
        const j=await r.json();
        const st=j.status||"?";
        outEl.textContent="job "+(j.job_id||"?")+" · "+st+(j.last_step?" · "+j.last_step:"");
        if(["done","failed","blocked","interrupted"].includes(st)) return;
      }
    }catch(_e){}
    await new Promise(res=>setTimeout(res,2000));
  }
}

/* ── 图像: 附件/粘贴 → canvas 降采样重编码 (顺带剥掉 EXIF) ── */
function scaleImage(file, maxSide, q){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1, maxSide/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",q));
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

const sky=$("#sky"), ctx=sky.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,DPR=1,P=[];
const state={mode:"idle",rate:0,t:0};

function lobeY(nx){
  const l=Math.exp(-((nx-0.36)**2)/0.028), r=Math.exp(-((nx-0.64)**2)/0.028);
  const cleft=Math.exp(-((nx-0.5)**2)/0.0009)*0.55;
  return Math.max(l,r)*(1-cleft);
}
function seed(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=sky.width=innerWidth*DPR; H=sky.height=innerHeight*DPR;
  sky.style.width=innerWidth+"px"; sky.style.height=innerHeight+"px";
  P=[];
  const N=Math.min(1600,Math.floor(innerWidth*innerHeight/420));
  for(let i=0;i<N;i++){
    const nx=Math.random();
    const depth=Math.pow(Math.random(),2.2);
    P.push({nx, ny:lobeY(nx)*0.30*depth + Math.random()*0.02,
      ph:Math.random()*6.283, sz:(Math.random()*1.15+0.35),
      fall:0, vy:0});
  }
}
function frame(){
  state.t+=1/60;
  ctx.clearRect(0,0,W,H);
  const falling = state.mode==="streaming" ? Math.min(1,state.rate/26) : 0;
  for(const p of P){
    let x=p.nx*W, y=p.ny*H;
    if(!reduce){
      if(state.mode==="thinking") p.nx += (0.5-p.nx)*0.0016;
      else if(state.mode==="streaming"){
        if(p.fall>0){
          p.vy += 0.00012*(0.5+falling);
          p.ny += p.vy; p.fall-=1/60;
          if(p.ny>0.92||p.fall<=0){ p.ny=lobeY(p.nx)*0.30*Math.pow(Math.random(),2.2); p.vy=0; p.fall=0; }
        }else if(Math.abs(p.nx-0.5)<0.045 && Math.random()<0.004+falling*0.02){
          p.fall=2.2+Math.random()*2;
        }
      }
      y=p.ny*H + Math.sin(state.t*0.5+p.ph)*1.4*DPR;
    }
    const tw = 0.20+0.42*Math.abs(Math.sin(state.t*0.7+p.ph));
    const a  = p.fall>0 ? Math.min(0.9,tw+0.35) : tw;
    ctx.fillStyle=`rgba(201,204,234,${a})`;
    ctx.fillRect(x, y, p.sz*DPR, p.sz*DPR);
  }
  requestAnimationFrame(frame);
}

function isMachineEnvelope(s){
  const t=String(s||"").trim();
  if(!t) return false;
  if(t.startsWith("{")&&t.includes("anomaly_flags")&&t.includes("candidate_count")) return true;
  if(t.startsWith("GRID_ABSENT")&&t.includes("NO LIVE GRID SIGNAL")) return true;

function scrubMsg(s){
  let t=String(s||"");
  t=t.replace(/📷/g,"").replace(/\s*\[📷\]\s*/g," ").replace(/\s*\[图\]\s*/g," ");
  if(_USER_TRIM.test(t.trim())) t="";
  for(const re of _NOISE_RES) t=t.replace(re,"\n");
  const kept=[];
  for(const line of t.split("\n")){
    const x=line.trim();
    if(x&&_NOISE_LINE.test(x)) continue;
    kept.push(line);
  }
  t=kept.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  if(isMachineEnvelope(t)) return "";
  if(!t) return "";
  if(/(?:抱歉|对不起|无法|不能|没法).{0,16}(?:看到|查看).{0,16}(?:图|图片|图像)/.test(t)) return "";
  if(/^(?:这(?:是|张|幅)|图中|图片|图像|照片|画面)/.test(t)&&/(?:颜色|色彩|色调|colou?r)/i.test(t)) return "";

function sha3_256_hex(str){
  const RC=[
    0x0000000000000001n,0x0000000000008082n,0x800000000000808an,0x8000000080008000n,
    0x000000000000808bn,0x0000000080000001n,0x8000000080008081n,0x8000000000008009n,
    0x000000000000008an,0x0000000000000088n,0x0000000080008009n,0x000000008000000an,
    0x000000008000808bn,0x800000000000008bn,0x8000000000008089n,0x8000000000008003n,
    0x8000000000008002n,0x8000000000000080n,0x000000000000800an,0x800000008000000an,
    0x8000000080008081n,0x8000000000008080n,0x0000000080000001n,0x8000000080008008n
  ];
  const rot=[
    0,1,62,28,27,36,44,6,55,20,3,10,43,25,39,41,45,15,21,8,18,2,61,56,14
  ];
  const MASK=0xffffffffffffffffn;
  function rotl(x,n){n=BigInt(n);return ((x<<n)|(x>>(64n-n)))&MASK}
  const rate=136;
  const stt=new BigUint64Array(25);
  const bytes=new TextEncoder().encode(String(str||""));
  const buf=new Uint8Array(Math.ceil((bytes.length+1+rate)/rate)*rate);
  buf.set(bytes); buf[bytes.length]=0x06; buf[buf.length-1]|=0x80;
  function keccakF(){
    for(let r=0;r<24;r++){
      const C=new BigUint64Array(5);
      for(let x=0;x<5;x++) C[x]=stt[x]^stt[x+5]^stt[x+10]^stt[x+15]^stt[x+20];
      const D=new BigUint64Array(5);
      for(let x=0;x<5;x++) D[x]=C[(x+4)%5]^rotl(C[(x+1)%5],1);
      for(let i=0;i<25;i++) stt[i]^=D[i%5];
      const B=new BigUint64Array(25);
      for(let x=0;x<5;x++) for(let y=0;y<5;y++){
        const i=x+5*y, j=y+5*((2*x+3*y)%5);
        B[j]=rotl(stt[i],rot[i]);
      }
      for(let x=0;x<5;x++) for(let y=0;y<5;y++){
        const i=x+5*y;
        stt[i]=B[i]^((~B[((x+1)%5)+5*y])&B[((x+2)%5)+5*y]);
      }
      stt[0]^=RC[r];
    }
  }
  const dv=new DataView(buf.buffer);
  for(let off=0;off<buf.length;off+=rate){
    for(let i=0;i<rate;i+=8) stt[i/8]^=dv.getBigUint64(off+i,true);
    keccakF();
  }
  const out=new Uint8Array(32);
  const od=new DataView(out.buffer);
  for(let i=0;i<4;i++) od.setBigUint64(i*8,stt[i],true);
  return [...out].map(b=>b.toString(16).padStart(2,"0")).join("");
}

    if(finish==="cc_candidate"||(finishMeta&&finishMeta.route_outcome==="cc_candidate")||(cur==="grid"&&isCompileTask(task)&&acc.trim())){
      showCcCandidatePanel(out,finishMeta||{reason:"compile_draft"},acc||text,h,task);
      tension=tensionTrack[cur].finish(tin,t||"[图]",{failed:false,blocked:false,finish});
      clearTimeout(timer); clearInterval(tick);
      state.mode="idle"; state.rate=0;
      $("#s").disabled=false; if(atBottom())toBottom();
      return;
    }
    if(!acc.trim()){
      if(rawAcc.trim()||blocked){
        out.className=cur==="qwen"?"g qwen err":"g err";
        out.textContent=blockedReplyHint(rawAcc);
      }else out.remove();
      acc="";
    }else{
      out.textContent=acc;
    }
    if(acc){
    const routeId=finishMeta?.route_id||finishMeta?.stream_integrity?.route_id;
    void reportStreamClientDiag(routeId,acc,out,sseChunkEvents,sseTerminal).then(clientDiag=>{
      if(clientDiag?.hash_mismatch_layers?.length){
        console.warn("stream hash mismatch",clientDiag.hash_mismatch_layers,clientDiag.four_way);
      }
      window.__LAST_STREAM_DIAG__=clientDiag||{route_id:routeId,finish:finishMeta};
    });
    const ttft=t1?Math.round(t1-t0):0;
    const laneLabel=cur==="grid"
      ?(isCompileTask(task)
        ?(backendId==="cc_cli"?"grid · compile · CC":"grid · compile · 本地")
        :(img?"grid · vl":"grid · aster"))
      :(img?"qwen 3.5 · vl":"qwen 3.5 · substrate");
    const costMeta=finishMeta?.cost_usd!=null?` · $${Number(finishMeta.cost_usd).toFixed(3)}`:"";
    const tele=`<i>${laneLabel}</i>${isCompileTask(task)?" · draft":""} · ${useModel}${costMeta} · ttft ${ttft}ms · ${state.rate.toFixed(1)}tk/s`
      +` · served_by ${gw.replace(/^https?:\/\//,"").replace(/\/v1\/?$/,"")}`
      +` · finish ${finish||"?"}`
      +(finishMeta?.continuation_retry?` · cont×${finishMeta.continuation_attempt||1}`:"");
    const td=document.createElement("div");
    td.className="t";
    td.innerHTML=tele;
    M.appendChild(td);
    h.push({role:"assistant",content:acc,tele});
    if(cur==="grid"){
      pushStoreMsgs(task,[{role:"assistant",content:acc}]);
      if(isCompileTask(task)) finishGridTurn(text,acc,task);
      else afterTurn(text,acc,task);
    }else{
      st.set("h:"+cur,h.slice(-80));
    }
    }
    tension=tensionTrack[cur].finish(tin,t||"[图]",{failed:false,blocked,finish});
  }catch(e){
    out.className="g err";
    let msg=acc;
    if(!msg){
      const badLocal=isLocalHost(new URL(gw,location.href).hostname)&&!isLocalHost(location.hostname);
      if(e.name==="AbortError"||String(e.message||"").includes("timeout")){
        msg=img
          ? `视觉模型加载/推理超时（>${Math.round(waitMs/1000)}s）— LM Studio 切 VL 模型较慢，请重试或先在 Mac 预载 qwen2.5-vl`
          : `推理超时（>${Math.round(waitMs/1000)}s）— 确认 LM Studio 在跑 qwen3.5-9b`;
      }else if(badLocal){
        gw=defaultGw(); st.set("gw",gw); $("#gw").value=gw;
        msg=`不能连 127.0.0.1（手机连不到 Mac）— 已改为 ${gw}，请重发`;
      }else if(String(e.message||"").startsWith("HTTP ")) msg=`${e.message} · ${gw}`;
      else msg=`连不上 ${gw} — 确认 Tailscale 已开，点 · 核对地址`;
    }
    out.textContent=msg;
    tension=tensionTrack[cur].finish(tin,t||"[图]",{failed:true,blocked:false,finish:null});
  }
  clearTimeout(timer);
  clearInterval(tick);
  if(tension){
    lastTension[cur]=tension; st.set("tension",lastTension);
    if(lane===cur) showTension(tension);
  }
  state.mode="idle"; state.rate=0;
  $("#s").disabled=false; if(atBottom())toBottom();
}
(function bindSendUi(){
  const btn=$("#s"), inp=$("#i");
  if(!btn) return;
  const go=()=>void send();
  btn.addEventListener("click",go);
  btn.addEventListener("pointerup",e=>{ if(e.pointerType==="touch") go(); });
  if(inp) inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); go(); }
  });
})();
$("#i").addEventListener("input",e=>{
  e.target.style.height="auto";
  e.target.style.height=Math.min(138,e.target.scrollHeight)+"px";
  if(lane==="grid") updateLaneHud();
});
syncCompileModeBtn();
updateLaneHud();

let voice=null;
const micBtn=$("#mic");
const bargeBtn=$("#voiceBarge");
const vst=$("#vst");
const vas=$("#vas");
const vdeg=$("#vdeg");
function voiceHist(){
  return activeHist(lane).map(m=>({role:m.role,content:m.content||""}));
}
function loadVoiceScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){resolve();return;}
    const s=document.createElement("script");
    s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error("script:"+src));
    document.head.appendChild(s);
  });
}
async function ensureVoiceScripts(){
  const ver=VOICE_JS_VER;
  if(typeof GridVoice!=="undefined"&&window.__GRID_VOICE_JS_VER===ver) return;
  document.querySelectorAll('script[src*="grid_voice.js"]').forEach(el=>el.remove());
  try{delete window.GridVoice;}catch(_e){window.GridVoice=undefined;}
  const base=String(gw||resolveGw()).replace(/\/v1\/?$/i,"");
  await loadVoiceScript(base+"/app/grid_voice.js?v="+encodeURIComponent(ver));
  window.__GRID_VOICE_JS_VER=ver;
}
async function toggleVoice(){
  try{
    await ensureVoiceScripts();
  }catch(e){
    vst.textContent="voice js 加载失败";
    return;
  }
  if(!voice){
    voice=new GridVoice({
      gwV1:gw,
      getHistory:voiceHist,
      onTurnState(s){
        bargeBtn.classList.toggle("on",s==="speaking");
        vst.textContent=s||"";
        micBtn.classList.toggle("on",s!=="idle");
      },
      onState(s){ /* onTurnState handles UI */ },
      onAudioSession(line){vas.textContent=line||"";},
      onDegrade(msg){if(msg)vdeg.textContent=msg;},
      onAsr(text){if(text)vst.textContent=`asr · ${text.slice(0,80)}`;},
      onSubtitle(t){if(t&&voice&&voice.turnState==="thinking")vst.textContent=t.slice(0,120);},
      onTtsStart(msg){
        const snippet=(msg.text||"").slice(0,60);
        vst.textContent=`tts:${msg.engine||"speechSynthesis"} · ${snippet}`;
      },
      onTtsEnd(){},
      onAssistant(text,meta){
        if(!text) return;
        const cleaned=cleanText(text);
        if(!cleaned) return;
        const h=activeHist(lane);
        const task=lane==="grid"?resolveGridTask(cleaned): "chat";
        if(lane==="grid") lastGridTask=task;
        if(meta&&meta.interrupt){
          for(let i=h.length-1;i>=0;i--){
            if(h[i].role==="assistant"){h[i].content=cleaned;break;}
          }
        }else{
          h.push({role:"assistant",content:cleaned});
        }
        if(lane==="grid"){
          const cleaned=cleanText(text);
          if(cleaned) pushStoreMsgs(task,[{role:"assistant",content:cleaned}]);
          if(cleaned&&isCompileTask(task)) finishGridTurn(lastUserContent(h),cleaned,task);
          else if(cleaned) afterTurn(lastUserContent(h),cleaned,task);
        }else{
          st.set("h:"+lane,h.slice(-80));
        }
        renderHist();
      },
      onError(msg){vst.textContent=msg;},
    });
  }
  try{
    const on=await voice.toggle();
    micBtn.classList.toggle("on",on);
    vst.textContent=on?"listening":"";
    if(!on){vas.textContent="";vdeg.textContent="";}
    else if(typeof gridVoiceAudioSessionStatus==="function"){
      vas.textContent=gridVoiceAudioSessionStatus();
    }
  }catch(e){
    vst.textContent="mic: "+(e.message||e);
    micBtn.classList.remove("on");
  }
}
micBtn.onclick=toggleVoice;
if(bargeBtn){
  const doBarge=()=>{ if(voice) voice.interrupt(); };
  bargeBtn.addEventListener("pointerdown",doBarge);
  bargeBtn.addEventListener("click",doBarge);
}
</script>
