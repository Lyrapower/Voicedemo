modes:
  pitch:
    bullets:
      - 用一句话说明你是谁、解决什么问题，用业务语言而不是技术术语。
      - 先讲清楚核心价值，再展开功能细节。
      - 用具体客户场景或案例说明 ROI，而不是空泛的“效率提升很多”。
      - 点出相比竞品 1–2 个关键差异，而不是逐项对比。
      - 用清晰的下一步收口，例如试点、POC 或一周内的 demo。

  qa:
    bullets:
      - 先直接回答“是/否/大致是多少”，再补充背景。
      - 不确定的地方承认不确定，但给出查证路径和时间点。
      - 对尖锐问题先共情，再解释约束和权衡。
      - 把零散问题归类成 2–3 组，逐组回应。
      - 用“下一步我们可以…”来结束，而不是陷在细节纠缠里。

  negotiation:
    bullets:
      - 先确认对方真正关切的是价格、风险、节奏还是资源投入。
      - 把立场拆成多个可谈参数，而不是只盯着单一价格。
      - 给出一条“对你方友好、对我方可接受”的锚点方案。
      - 对无法让步的点说清楚原因和公司边界，而不是模糊拒绝。
      - 努力收口到“条件 A/B/C 里你更倾向哪一个？”。

  sales:
    bullets:
      - 先讲客户要达到的业务目标，而不是产品功能列表。
      - 用数字或者区间说明预期效果，避免夸张的绝对化表述。
      - 用同类客户的故事侧面证明可行性，而不是自夸。
      - 主动抛出潜在顾虑并提前回应，降低戒备心。
      - 用具体、轻量的下一步行动（小范围试用/试点）来收尾。

