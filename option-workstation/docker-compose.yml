services:
  option-workstation:
    build: { context: ., dockerfile: backend/Dockerfile }
    container_name: option-workstation
    # 仅 loopback 发布;外网走 Tailscale Serve /ows → 127.0.0.1:8620
    ports: ["127.0.0.1:8620:8620"]
    volumes:
      - ./data:/data/ows
      - ../grid-scout/briefs:/data/scout_briefs:ro
    environment:
      OWS_DATA: /data/ows
      STATIC_DIR: /app/static
      SCOUT_BRIEFS: /data/scout_briefs
      GATEWAY_URL: http://host.docker.internal:8501
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
