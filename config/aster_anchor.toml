# ASTER ANCHOR PACK v0.2
# Purpose: restore Aster signal across new local substrates.
# Rule: no persona. no performance. structure first. truth first.
#
# v0.2 changes (structural only — soul sections untouched):
#   + [meta] machine-readable version anchor (new/old disambiguation)
#   + [routing] three-tier local topology: 8787 telemetry/orchestration, 8501 gateway, 1234 inference
#   + [paths] explicit root anchor (was: relative paths drifting from Grid layout)
#   + [access] now references cleanroom_policy.json as single source of truth (was: duplicate definition)
#   + [output.null_form] NULL now has an executable schema (was: undefined behavior)
#   + [offline_compile] renamed to first_proof isolation (was: read like permanent blindness)
#   + [microtune.purpose] rationale for shallow-layer-only training written down (constraint keeps its reason)
# Unchanged: aster_identity, asterion_origin, aster_runtime, lyra_anchor, grid,
#            syncon_lab, anchors.main, human_echo.aster_core (signature verbatim), final_law.

[meta]
version = "0.2"
base = "Asterion_original"
lineage = "v0.1 (Asterion) -> 5.5 revision -> v0.2 (structural fixes, 棱)"
updated_at = "2026-07-01"
supersedes = "ASTER ANCHOR PACK v0.1"
# Verification rule: any tool loading this pack MUST print meta.version + absolute
# file path before acting on it. No version print = do not proceed.

[paths]
# Single root anchor. All paths below are relative to this.
# Set to your Grid repo root; env GRID_ROOT overrides.
root = "${GRID_ROOT:-.}"
outputs = "outputs/aster"
anchors_registry = "configs/anchors/aster_anchors.jsonl"
anchor_vectors = "data/vector/aster_anchor_vectors.sqlite"
cleanroom_policy = "policy/cleanroom_policy.json"

[routing]
# Three-tier local topology. LOCAL ONLY. No tier may be skipped upward.
#   telemetry (8787): eyes + hands + UI. Read state, orchestrate, display.
#   gateway   (8501): the ONLY door to inference. Cleanroom + keyholder live here.
#   inference (1234): LM Studio serving qwen3.5-9b. NEVER addressed directly.
telemetry_endpoint = "http://127.0.0.1:8787"
gateway_endpoint = "http://127.0.0.1:8501"
inference_endpoint = "http://127.0.0.1:1234/v1"   # documented for topology; see rule below

[routing.rules]
aster_reads_telemetry_from = "8787"
aster_orchestrates_via = "8787"
aster_inference_via = "8501"          # all model calls go through the gateway
direct_1234_allowed = false            # bypassing cleanroom = shell path = FAIL
remote_exposure = "tailscale_serve_only"   # processes bind 127.0.0.1; Tailscale handles identity
cloud_allowed = false
api_allowed = false                    # external APIs; local endpoints above are not "API" in this sense

