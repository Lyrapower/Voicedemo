# missions.toml — four target functions (MISSION v1). 本包只跑 ①。
# Each [mission.<id>] = a runnable mission template. ②③④ 本包只落 config 行 + 处决案 ⑫ dry-run。

[mission.scout]
lane = "scout"
worker = "deep"         # 钉死 glm-5.2 (cloud-glm52);runner 不 fallback 到 research。工具环按 allowed_tools 开(§①4)。
budget_hops = 30
budget_tokens = 0
budget_wall_s = 3600     # 60 min
budget_usd = 1.0
stop_conditions = []
tools = ["web.fetch", "web.search", "grants.catalog"]
data_sources = ["api.grants.gov", "www.grants.gov", "data.ca.gov"]
egress_lanes = ["scout"]
goal = """
你是资源侦察 worker。目录源里当前开放的公开机会,你只做三件事,每条一行可解析:
1. kind:归入七类之一——资金 / 硬件资源 / 项目与人才计划 / 融资 / 采购 / 社区 / 政策数据。
2. eligibility:原文摘录申请人资格条款,不归类、不判是否符合;摘不到写 needs_verification。
3. note:一句事实(规模、地区、主办方类型),没有就留空。
你不判断"是否相关",不按申请人、领域、地区筛选,不写"不符合目标"。
HIT / MISS 不由你判:runner 按字段齐全(opp_id、title、agency、deadline 可解析且未过、URL、event_id)判 HIT;缺字段且 detail 取不到、或 deadline 已过判 MISS。
输出上限:每跳把拿到的行全部写完,不截断,不挑选。
"""
note = "scout catalog recon; goal field is the worker prompt"

# SOURCE v2 / Universe v4: discovery unfiltered. cap is display only.
[mission.scout.search]
schema_version = 2
universe_version = 4
mode = "global_unfiltered"
profile_filter = false
unknown_is_allowed = true
display_page_size = 30
deadline_min_days = 0

[mission.scout.search.grants_gov]
enabled = true
eligibilities = ""
agencies = ""
fundingCategories = ""
oppStatuses = "forecasted|posted"
rows_per_query = 25
keywords_per_hop = 4
keywords = [
  "artificial intelligence",
  "machine learning",
  "compute infrastructure",
  "research software",
  "cyberinfrastructure",
  "open source",
  "data infrastructure",
  "SBIR",
  "STTR",
  "energy efficiency buildings",
  "digital twin",
  "industrial innovation",
  "workforce training",
  "edge computing",
  "water cooling",
  "commercial real estate",
]

[mission.scout.search.ca_grants]
enabled = true
package_id = "california-grants-portal"
page_size = 200
applicant_filter = false
exclude_urgent = false
note = "2026-09-09 egress ok; ApplicationDeadline; no ApplicantType gate"

[mission.scout.search.sam_gov]
enabled = true
auth_mode = "approved_broker_loader"
note = "无 SAM_API_KEY → auth_required; 不阻塞其他源"

[mission.builder]
lane = "builder"
worker = "cc"           # glm-5.3 in sandbox
budget_hops = 40
budget_tokens = 0
budget_wall_s = 7200     # 120 min
budget_usd = 3.0
stop_conditions = []
tools = ["bash", "fs.read"]   # 沙盒内工具面；写只在 /work（sandbox 内），不暴露 fs.write
data_sources = []
egress_lanes = []
sandbox_mounts = ["harness_resident"]
note = "降低 harness 每 job token 成本不降等级;每个改法=沙盒单文件 prototype + 处决案 + benchmark;diff 只到 dossier 不合入"

[mission.gardener]
lane = "gardener"
worker = "deep"
budget_hops = 30
budget_tokens = 0
budget_wall_s = 3600
budget_usd = 1.0
stop_conditions = []
tools = ["fs.read"]     # 只读挂载
data_sources = []
egress_lanes = []
sandbox_mounts = ["memory-palace/vault"]
note = "扫记忆文件与 provenance,列过期/冲突/孤簇;每条出 hypothesis 收据,不改任何文件"

[mission.rwa]
lane = "rwa"
worker = "deep"
read_only = true
budget_hops = 40
budget_tokens = 0
budget_wall_s = 7200
budget_usd = 3.0
stop_conditions = []
tools = ["rwa.read"]
data_sources = ["rpc.three"]
egress_lanes = ["rwa"]
goal = """
你是 RWA 事实登记 worker。对 rwa.read 返回的每张证据卡,你只做三件事,每条一行可解析:
1. kind:归入四类之一——代币化国债 / 代币化基金 / 代币化股票 / 稳定币。
2. issuer:原文摘录发行方与托管方名称,不评价。
3. note:一句事实(链、规模、NAV 口径),没有就留空。
你不判断"好坏"、不给方向、不写建议。HIT / MISS 由 runner 按卡上 confidence 判:witnesses_agree 及以上为 HIT,dispute / skipped 为 MISS。
"""
note = "rwa.read chain-only; rwa.xyz egress_pending"

[mission.rwa.wallet]
kind = "onchain"
provider = "local_eoa"
budget_usd = 100
note = "两周只出 dossier 一笔不交易也算过"

[mission.day_trade]
lane = "day_trade"
worker = "deep"
budget_hops = 20
budget_tokens = 0
budget_wall_s = 14400
budget_usd = 1.0
stop_conditions = []
tools = ["web.fetch"]
data_sources = []
egress_lanes = ["scout"]
note = "paper day session; money job born BLOCKED; open = /approve W-"

[mission.day_trade.wallet]
kind = "alpaca_paper"
provider = "alpaca"
budget_usd = 100
max_per_tx = 25
max_daily_loss = 20
max_positions = 2
