{% import "partials/ui_macros.html" as ui %}
<div class="jv-metric">
  <div class="jv-label-mute">{{ ui.lbl(card.label) }}</div>
  <div class="jv-metric-value-soft {% if card.tone == 'pass' or card.tone == 'ready' %}status-pass{% elif card.tone == 'fail' or card.tone == 'blocked' %}status-blocked{% else %}status-neutral{% endif %}">{{ ui.v(card.value) }}</div>
  {% if card.meta %}
  <div class="jv-note-tiny jv-mono jv-path-clip" title="{{ card.meta }}">{{ card.meta }}</div>
  <button type="button" class="jv-btn-copy jv-btn-copy-tiny" data-copy-text="{{ card.meta }}">Copy</button>
  {% endif %}
</div>
